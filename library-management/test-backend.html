<!DOCTYPE html>
<html>
<head>
    <title>Backend Test</title>
</head>
<body>
    <h1>Library Management Backend Test</h1>
    <div id="result"></div>
    
    <script>
        async function testBackend() {
            const resultDiv = document.getElementById('result');
            
            try {
                // Test if backend is responding
                const response = await fetch('http://localhost:3001/');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h2>✅ Backend is working!</h2>
                    <p>Response: ${JSON.stringify(data)}</p>
                    <h3>Now test registration:</h3>
                    <button onclick="testRegister()">Test Register</button>
                    <button onclick="testLogin()">Test Login</button>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2>❌ Backend Error</h2>
                    <p>Error: ${error.message}</p>
                    <p>Make sure the backend server is running on port 3001</p>
                `;
            }
        }
        
        async function testRegister() {
            try {
                const response = await fetch('http://localhost:3001/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: 'Test User',
                        email: 'test@example.com',
                        password: 'password123',
                        phone: '+1-555-0123',
                        address: '123 Test Street',
                        membershipType: 'public'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('result').innerHTML += `
                        <h3>✅ Registration Success!</h3>
                        <p>User: ${data.member.name}</p>
                        <p>Email: ${data.member.email}</p>
                        <p>Membership ID: ${data.member.membershipId}</p>
                    `;
                } else {
                    document.getElementById('result').innerHTML += `
                        <h3>❌ Registration Failed</h3>
                        <p>Error: ${data.message}</p>
                    `;
                }
            } catch (error) {
                document.getElementById('result').innerHTML += `
                    <h3>❌ Registration Error</h3>
                    <p>Error: ${error.message}</p>
                `;
            }
        }
        
        async function testLogin() {
            try {
                const response = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('result').innerHTML += `
                        <h3>✅ Login Success!</h3>
                        <p>Welcome: ${data.member.name}</p>
                        <p>Token received: ${data.token ? 'Yes' : 'No'}</p>
                    `;
                } else {
                    document.getElementById('result').innerHTML += `
                        <h3>❌ Login Failed</h3>
                        <p>Error: ${data.message}</p>
                    `;
                }
            } catch (error) {
                document.getElementById('result').innerHTML += `
                    <h3>❌ Login Error</h3>
                    <p>Error: ${error.message}</p>
                `;
            }
        }
        
        // Test backend on page load
        testBackend();
    </script>
</body>
</html>
